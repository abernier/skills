name: Test

# The suite is the only thing standing between a naming convention changing and
# the buckets quietly following it — a wrong grouping still renders as a
# plausible table. And the report's types are stripped at run time, never
# checked, so nothing but `tsc` reads them.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The uppercase gate, not the lowercase one: `pnpm run LGTM` is `pnpm run
  # lgtm` plus the end-to-end bench suite, and dev↔CI parity is about the two
  # running the same command. The slow half is the only coverage the harness has
  # of itself against a real browser, so CI is precisely where it must not be
  # skipped.
  LGTM:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Without it the renderer half of the suite skips itself, and says so.
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      # Same deal for the gesture suite: the browser is a separate download from
      # the npm install, and the suite skips itself without one.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The same command as locally, so a green branch here is a green branch
      # there: typecheck, shellcheck, the fast suite, then both benches driven
      # end to end against the fixture app.
      - run: pnpm run LGTM

  # Dogfood: the plugin's own PRs get the report its callers get, so the
  # reusable workflow is exercised by the repo that ships it — and the ref it
  # pins is this branch, not `main`.
  branchstat:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/branchstat.yml
    permissions:
      contents: read
      pull-requests: write
